name: Release

# Publishes a GitHub Release with the Chrome, Edge and Firefox packages.
# Create one with:  npm version patch|minor|major  &&  git push --follow-tags
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run zip:all
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .output/*.zip --verify-tag --generate-notes --title "PassGen ${GITHUB_REF_NAME}"
