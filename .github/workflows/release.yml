name: Release

# Publishes a GitHub Release with the Chrome, Edge and Firefox packages.
# Either:
#   - npm version patch|minor|major && git push --follow-tags   (push a vX.Y.Z tag), or
#   - bump the version on main, then Actions → Release → "Run workflow"
#     (creates the vX.Y.Z tag from package.json on the selected commit).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${tag}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists. Bump the version in package.json first."
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - run: npm ci
      - run: npm run zip:all
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "${TAG}" .output/*.zip --target "${GITHUB_SHA}" --generate-notes --title "PassGen ${TAG}"

  # Uploads the exact Chrome zip from the GitHub release to the Chrome Web Store
  # and submits it for review. Skipped until the CHROME_EXTENSION_ID repository
  # variable is set. See README → "Publishing to the Chrome Web Store".
  submit-chrome:
    name: Submit to Chrome Web Store
    needs: release
    if: vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the released Chrome zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "${TAG}" --pattern '*-chrome.zip' --dir release
      - name: Submit
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npx wxt submit --chrome-zip release/*-chrome.zip
